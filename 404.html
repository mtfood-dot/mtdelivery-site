<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable – MT Delivery</title>
<link rel="icon" href="/favicon.png">
<meta name="theme-color" content="#0a2647">
<style>
:root{--navy:#0a2647;--gold:#f2b51c;--fg:#0d1b30;--muted:#5a6a82;--bg:#f4f6fa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55}
header{background:var(--navy);padding:12px 16px}
header a{display:inline-block;background:#fff;border-radius:10px;padding:4px 8px}
header img{display:block;height:40px;width:auto}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.box{max-width:520px;width:100%;text-align:center}
.code{font-weight:900;font-size:4.5rem;line-height:1;color:var(--gold);margin:0}
h1{font-size:1.5rem;margin:10px 0 6px}
p{color:var(--muted);margin:0 0 6px}
.ar{direction:rtl;margin-top:18px}
.ar h1{font-size:1.35rem}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}
.acts a{text-decoration:none;font-weight:700;border-radius:999px;padding:11px 18px;min-height:44px;display:inline-flex;align-items:center}
.gold{background:var(--gold);color:var(--navy)}
.line{border:1.5px solid var(--navy);color:var(--navy)}
</style>
</head>
<body>
<header><a href="/" aria-label="MT Delivery – accueil"><img src="/logo-mt.png" alt="MT Delivery – البريد السريع" width="228" height="114"></a></header>
<main>
  <div class="box">
    <p class="code" aria-hidden="true">404</p>
    <h1>Page introuvable</h1>
    <p>Cette page n'existe pas ou a été déplacée.</p>
    <div class="ar" lang="ar">
      <h1>الصفحة غير موجودة</h1>
      <p>هذه الصفحة غير موجودة أو تم نقلها.</p>
    </div>
    <div class="acts">
      <a class="gold" href="/">Accueil · الرئيسية</a>
      <a class="line" href="/#suivi">Suivre un colis · تتبّع طرد</a>
      <a class="line" href="/#contact">Contact · اتصل بنا</a>
    </div>
  </div>
</main>
</body>
</html>
